# Mosquitto TLS/mTLS Configuration for EM_server
# Copy to: /etc/mosquitto/conf.d/tls.conf

# TLS listener on port 8883
listener 8883
protocol mqtt

# Server identity (how clients verify the broker)
# ca.crt: CA raiz que firma todos los certificados del sistema
# EM-broker.crt: certificado del broker Mosquitto
# EM-broker.key: clave privada del broker
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/EM-broker.crt
keyfile  /etc/mosquitto/certs/EM-broker.key

# mTLS: Require client certificates
# Cuando esta en "true", el broker RECHAZA clientes sin certificado.
# Solo los dispositivos con un certificado firmado por la CA pueden conectarse.
require_certificate true

# Use the CN from the client certificate as the MQTT username
# Ejemplo: CN=esp32_01 → el broker lo identifica como usuario "esp32_01"
# Esto permite usar el ACL por usuario sin necesidad de password.
use_identity_as_username true

# Minimum TLS version
# TLS 1.2 es el minimo recomendado. Versiones anteriores tienen vulnerabilidades.
tls_version tlsv1.2
