[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "em-server"
version = "1.0.0"
description = "EM Server – IoT greenhouse monitoring and irrigation dashboard"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt==1.6.1",
    "Flask==2.3.3",
    "Werkzeug==2.3.7",
    "sense-hat>=2.3.1,<3",
]

[tool.setuptools]
packages = ["em_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
