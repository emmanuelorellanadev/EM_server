<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EM Server – Monitoreo de Sensores{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🌱 EM Server</h1>
      <p class="subtitle">Monitoreo Meteorológico de Sensores IoT</p>
      <nav>
        <a href="{{ url_for('dashboard.index') }}" {% if request.endpoint == 'dashboard.index' %}class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('dashboard.history') }}" {% if request.endpoint == 'dashboard.history' %}class="active"{% endif %}>Historial</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>EM Server &mdash; Sistema de Monitoreo Meteorológico</p>
  </footer>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
